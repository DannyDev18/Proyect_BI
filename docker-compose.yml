services:
  # ── 1. PostgreSQL — Data Warehouse + App (UN SOLO SERVIDOR) ─────────────────
  # Aloja dos esquemas:
  #   - public.* → tablas de la app: roles, usuarios (autenticación RBAC)
  #   - edw.*    → Data Warehouse: dimensiones, hechos, KPIs, analytics
  postgres_edw:
    # Versión menor fijada (M-24, docs/features/plan_mejoras_proyecto.md): un `pull`
    # futuro con solo "16-alpine" puede traer una versión distinta a la que ya corre
    # el volumen existente (hoy 16.13). Al subir de versión menor deliberadamente,
    # documentar el procedimiento de upgrade (pg_upgrade o dump/restore) antes de tocar
    # este tag en un entorno con datos reales.
    image: postgres:16.13-alpine
    container_name: bi_postgres_edw
    restart: unless-stopped
    environment:
      POSTGRES_DB: edw
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - edw_data:/var/lib/postgresql/data
      - ./edw:/docker-entrypoint-initdb.d # Ejecuta todos los SQL en orden al iniciar
    ports:
      - "5433:5432" # Expuestos en 5433 al host para no colisionar con PG local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d edw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Backend FastAPI ───────────────────────────────────────────────────────
  # Este servicio representa el comportamiento "producción-like": sin hot-reload y
  # sin acceso al código fuente de ml/ (solo a los artefactos .pkl ya entrenados).
  # Para desarrollo local, docker-compose.override.yml se aplica automáticamente
  # (sin flags extra) y reintroduce hot-reload + el mount de ml/ para poder probar
  # POST /admin/modelos/retrain.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bi_backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      # Fase 3 (§5.2.1 opción 1 del plan de mejora ML): el backend dispara
      # `docker compose run --rm ml ...` en el HOST vía el socket compartido abajo.
      # Docker resuelve los bind-mounts del compose (`./ml:/app`, etc.) contra el
      # filesystem del host, no el del contenedor backend -- por eso necesita conocer
      # la ruta ABSOLUTA del proyecto en el host (el backend ve /app dentro de su propio
      # contenedor, que no es la misma ruta). Ajustar en .env si el repo no vive en
      # C:\Proyect_BI en el host.
      # `docker run` (no `docker compose run`, ver TrainingService): el daemon resuelve
      # el bind-mount `-v "<HOST_PROJECT_DIR>\ml:/app"` contra el filesystem del host, no
      # el de este contenedor.
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-C:\Proyect_BI}
    depends_on:
      postgres_edw:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml_models:ro
      # Contratos declarativos (JSON), no código fuente de ml/ -- es la interfaz
      # documentada entre las dos imágenes Docker (docs/ml_contracts.md).
      - ./ml/contracts/models:/app/ml_contracts:ro
      # Socket de Docker del host (patrón "Docker-outside-of-Docker", ya usado por
      # ml/publish_models.py desde el host): permite que el backend orqueste
      # `docker run ... proyect_bi-ml ...` (imagen ya construida por
      # `docker compose build ml`) sin tener el código de ml/ dentro de su propia
      # imagen. Se usa `docker run` y NO `docker compose run` -- probado en este
      # entorno (Docker Desktop/Windows): Compose necesita LEER localmente tanto el
      # YAML como el `.env` que auto-carga para interpolación, y este contenedor no
      # tiene una ruta local que corresponda a `HOST_PROJECT_DIR` (con backslashes de
      # Windows); `docker run -v "<HOST_PROJECT_DIR>\ml:/app"` en cambio solo necesita
      # que el DAEMON (que sí corre en el host real) resuelva el string del bind-mount,
      # y Docker Desktop acepta rutas estilo Windows ahí sin que el cliente las vea
      # localmente. Riesgo de seguridad real y documentado -- ver comentario en
      # backend/Dockerfile y §11 de docs/features/plan_mejora_pipeline_ml.md.
      - /var/run/docker.sock:/var/run/docker.sock

  # ── 3. Frontend React ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bi_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src # Hot-reload Vite
    depends_on:
      - backend

  # ── 4. ETL Runner (ejecución manual o programada) ───────────────────────────
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: bi_etl
    env_file: .env
    environment:
      # Dentro del contenedor Linux se usa FreeTDS (instalado en la imagen); este
      # override gana sobre el DB_DRIVER del .env, que puede seguir apuntando al
      # driver nativo de Windows para ejecuciones del ETL en el host.
      DB_DRIVER: FreeTDS
    depends_on:
      postgres_edw:
        condition: service_healthy
    # No se inicia automáticamente; ejecutar con: docker compose run etl
    profiles: ["etl"]

  # ── 5. ML Orchestrator (pipeline de entrenamiento) ──────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: bi_ml
    env_file: .env
    depends_on:
      postgres_edw:
        condition: service_healthy
    volumes:
      - ./ml:/app
    ports:
      - "8888:8888"
    profiles: ["ml"]

volumes:
  edw_data:
